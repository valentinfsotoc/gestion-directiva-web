:root{
  /* Idea de diseño: herramienta de escritorio directivo. Barra superior con la identidad de la escuela,
     navegación inferior en teléfono y lateral en pantallas anchas; los documentos se ven como hojas blancas
     con el membrete institucional. Los colores de marca vienen del Perfil Institucional. */
  --bg:#f3f4f0; --surface:#ffffff; --surface-2:#e9ebe4; --ink:#1b201a; --muted:#5b6459; --line:#d5d9cf;
  --brand:#2f5d7c; --brand-dark:#1e3d52; --accent:#e0a526; --on-brand:#ffffff; --brand-text-light:#1e3d52;
  --brand-text:var(--brand-text-light);
  --ok:#2c7a4b; --warn:#a86200; --crit:#b3261e;
  --f-display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141713; --surface:#1d211c; --surface-2:#282d27; --ink:#e8ebe5; --muted:#a2aa9e; --line:#373d35;
    --brand-text:color-mix(in srgb,var(--brand) 42%,white);
    --ok:#74c796; --warn:#e9b45e; --crit:#f28b83; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141713; --surface:#1d211c; --surface-2:#282d27; --ink:#e8ebe5; --muted:#a2aa9e; --line:#373d35;
  --brand-text:color-mix(in srgb,var(--brand) 42%,white);
  --ok:#74c796; --warn:#e9b45e; --crit:#f28b83; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
a{color:var(--brand-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:20}
.top img{height:40px;width:auto;border-radius:4px;background:#fff;padding:2px}
.top .esc{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.15}
.top .sub{font-size:.78rem;opacity:.85}
.top .grow{flex:1;min-width:0}
.chip-est{font-size:.72rem;border:1px solid color-mix(in srgb,var(--on-brand) 45%,transparent);border-radius:999px;padding:3px 9px;white-space:nowrap}

.shell{display:flex;flex-direction:column;min-height:calc(100vh - 62px)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;border-radius:8px}
.nav a[aria-current="page"]{color:var(--brand-text);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.nav svg{width:22px;height:22px}
main{flex:1;padding:16px 16px 96px;max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){
  .shell{flex-direction:row}
  .nav{position:sticky;top:62px;align-self:flex-start;flex-direction:column;justify-content:flex-start;gap:4px;width:190px;height:calc(100vh - 62px);border-top:0;border-right:1px solid var(--line);padding:16px 10px}
  .nav a{flex:none;flex-direction:row;gap:10px;font-size:.95rem;padding:10px 12px}
  main{padding:24px 28px 48px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.82rem;color:var(--muted)}
.tile.crit{border-left-color:var(--crit)} .tile.warn{border-left-color:var(--warn)} .tile.ok{border-left-color:var(--ok)} .tile.br{border-left-color:var(--brand)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);min-height:42px}
.btn:hover{border-color:var(--brand)}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.sm{padding:5px 9px;min-height:34px;font-size:.85rem}
.btn.ico{padding:7px;min-height:36px;min-width:36px;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--crit);border-color:var(--crit);color:#fff}
.needs-ia,.needs-mic,.needs-dl,.needs-cal,.needs-drive,.solo-and{display:none!important}
.es-android .solo-and{display:inline-flex!important}
.has-ia .needs-ia,.has-mic .needs-mic,.has-dl .needs-dl,.has-cal .needs-cal{display:inline-flex!important}
.has-ia .card.needs-ia,.has-drive .card.needs-drive{display:flex!important}

.lista{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:10px 12px}
.item.crit{border-left-color:var(--crit)} .item.warn{border-left-color:var(--warn)} .item.ok{border-left-color:var(--ok)} .item.hecho{opacity:.6}
.item .cuerpo{flex:1;min-width:0}
.item .tit{font-weight:600;overflow-wrap:anywhere}
.item .acc{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.item button.tit{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--brand-text);text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.pill.crit{color:var(--crit)} .pill.warn{color:var(--warn)} .pill.ok{color:var(--ok)} .pill.n{color:var(--muted)} .pill.ej{color:var(--muted);border-style:dashed}

.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.grid3{grid-template-columns:1fr 1fr 1fr}}
.f{display:flex;flex-direction:column;gap:4px}
.f>span{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
.f textarea{min-height:110px;resize:vertical;line-height:1.5}
.f input[type=color]{padding:3px;height:42px}
.f .conmic{display:flex;gap:6px;align-items:flex-start}
.f .conmic>:first-child{flex:1}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.aviso{border:1px solid var(--line);border-left:5px solid var(--warn);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.9rem}
.aviso.info{border-left-color:var(--brand)}
.rev{display:flex;flex-direction:column;gap:6px}
.rev div{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.rev i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted)}
.rev .crit i{background:var(--crit)} .rev .warn i{background:var(--warn)} .rev .ok i{background:var(--ok)}

.editor{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}.editor>*{min-width:0}
@media (min-width:1050px){.editor{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}.editor .prev{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto}}
.prev{overflow-x:auto}
.paper{background:#fff;color:#1a1a1a;color-scheme:light;font-family:Carlito,Calibri,'Source Sans 3',sans-serif;font-size:14px;line-height:1.4;padding:26px 30px;border:1px solid #cfd3c9;box-shadow:0 2px 10px rgba(0,0,0,.12);min-width:520px;max-width:760px;margin:0 auto}
.paper .memb{display:flex;gap:12px;align-items:center;border-bottom:1px solid #a6a6a6;padding-bottom:8px;margin-bottom:16px}
.paper .memb img{height:62px;width:auto}
.paper .memb b{font-family:Georgia,serif;font-size:17px;color:var(--pc);display:block}
.paper .memb span{display:block;font-size:11px;color:#595959}
.paper .memb em{font-size:11px;color:#595959;display:block}
.paper .der{text-align:right}
.paper .tit{font-weight:700;color:var(--pc);border-bottom:1.5px solid var(--pc);padding-bottom:2px;margin-bottom:6px;font-size:15px}
.paper .am{font-weight:700;color:var(--pd)}
.paper .fecha{font-style:italic;margin:22px 0 12px}
.paper .dea{display:grid;grid-template-columns:44px 1fr;margin-bottom:12px;font-family:Cambria,Georgia,serif;font-size:13px}
.paper .cuerpo p{text-align:justify;margin:0 0 10px}
.paper .cuerpo h4{margin:14px 0 8px;font-size:14px}
.paper .cuerpo ul{margin:0 0 10px;padding-left:22px}
.paper .cuerpo li{text-align:justify;margin-bottom:3px}
.paper .firma{text-align:center;margin:18px 0}
.paper .firma img{max-height:110px;max-width:260px}
.paper .firma .linea{display:inline-block;border-top:1px solid #444;padding-top:4px;min-width:220px;margin-top:54px;font-size:12.5px}
.paper .dist{font-size:12px;margin-left:36px}
.paper .dist ul{list-style:"-   ";margin:0;padding-left:22px}
.paper .barra{background:var(--pc);color:#fff;font-weight:700;padding:3px 8px}
.paper .barra.g{font-family:Georgia,serif;font-size:19px;text-align:center;letter-spacing:.03em}
.paper .barra.s{font-size:11.5px;margin:16px 0 8px}
.paper .subt{text-align:center;font-style:italic;font-size:12px;margin:4px 0 14px}
.paper .campos{display:grid;grid-template-columns:2.2fr 1fr 1fr;gap:6px 14px;font-size:12px;margin-bottom:6px}
.paper .campos label{font-weight:700;color:var(--pd);font-size:10.5px;display:block}
.paper .campos div div{border-bottom:1px solid #444;min-height:20px}
.paper table{border-collapse:collapse;width:100%;font-size:12.5px}
.paper td,.paper th{border:1px solid #000;padding:2px 6px;vertical-align:top;text-align:left}
.paper th{background:var(--pc);color:#fff;padding:7px 6px}
.paper td.area{background:var(--pc);color:#fff;font-weight:700}
.paper td.tema{background:#f7f9f5;white-space:pre-wrap}
.paper td.c{text-align:center}
.paper .salto{border-top:2px dashed #b9bdb3;margin:26px -30px;position:relative}
.paper .salto::after{content:"página siguiente";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#fff;padding:0 8px;font-size:10px;color:#888}
.paper .pie{border-top:1px solid #a6a6a6;margin-top:22px;padding-top:4px;text-align:center;font-size:10px;color:#595959}

.hoja-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.hoja{background:var(--surface);border-radius:14px 14px 0 0;padding:18px;width:100%;max-width:560px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.hoja-bg{align-items:center;padding:20px}.hoja{border-radius:14px}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;max-width:min(92vw,520px);font-size:.92rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.vivo{position:fixed;left:16px;right:16px;bottom:140px;z-index:55;background:var(--crit);color:#fff;border-radius:8px;padding:8px 12px;font-size:.9rem;max-width:520px;margin:0 auto}
table.tabla{width:100%;border-collapse:collapse;font-size:.92rem}
table.tabla th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:4px 6px}
table.tabla td{padding:4px 6px;vertical-align:top}
table.tabla input,table.tabla textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 8px;width:100%;min-height:38px}
.asist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px}
.swatch{display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid var(--line);vertical-align:-4px}
.item.ev{border-left-color:var(--brand)}
.item a.tit{color:var(--brand-text)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.nav a{min-width:0}
@media (max-width:520px){.nav a{font-size:.62rem;letter-spacing:-.01em}.nav svg{width:20px;height:20px}}
.adjs{display:flex;flex-direction:column;gap:8px;margin:6px 0}.adjs.cmp{flex-direction:row;flex-wrap:wrap}
.adj{display:flex;gap:10px;align-items:center;min-width:0}.adjs.cmp .adj{max-width:100%}
.adj-v{flex:0 0 auto;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.adjs.cmp .adj-v{width:44px;height:44px}.adj-v.otro{cursor:default;opacity:.75}
.adj-v img{width:100%;height:100%;object-fit:cover;display:block}.adj-ic{font-size:.72rem;font-weight:700;color:var(--muted)}
.adj-t{display:flex;flex-direction:column;gap:2px;min-width:0}.adj-t>.small:first-child{overflow-wrap:anywhere}.adjs.cmp .adj-t{display:none}
.tabla{overflow:auto}.tabla table{border-collapse:collapse;font-size:.82rem}.tabla td{border:1px solid var(--line);padding:4px 8px;vertical-align:top;white-space:nowrap}
.prop{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.inl{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

        // stop and give other evnts on the evnt loop a chance to run. ~RicMoo
        const incrementalSMix = function() {
            if (stop) {
                return callback(new Error('cancelled'), currentOp / totalOps);
            }

                    // for (var i = 0; i < p; i++)...
                    Bi = i0 * 32 * r;

                    arraycopy(B, Bi, XY, 0, Yi);                       // ROMix - 1

                    state = 1;                                         // Move to ROMix 2
                    i1 = 0;

                        blockmix_salsa8(XY, Yi, r, x, _X);             // ROMix - 4
                    }

                    currentOp += steps;

                        }

                    i1 = 0;                                          // Move to ROMix 6
                    state = 2;

                    i1 += steps;
                    currentOp += steps;

                    // Call the callback with the progress (optionally stopping us)
                    if (callback) {
                        const percent10 = parseInt(1000 * currentOp / totalOps);
                        if (percent10 !== lastPercent10) {
                            stop = callback(null, currentOp / totalOps);
                            if (stop) { break; }
                            lastPercent10 = percent10;
                        }
                    }

                    if (i1 < N) { break; }

                    arraycopy(XY, 0, B, Bi, Yi);                     // ROMix - 10

                    // for (var i = 0; i < p; i++)...

                        state = 0;
                        break;
                    }

  ref(k){return this.db.collection('data/users/'+this.uidv).doc(k)},

  },
  guardar(k){clearTimeout(this.t[k]);this.t[k]=setTimeout(()=>{this.t[k]=null;this.escribir(k)},700);pintarEstado('Guardando…')},
  flush(){Object.keys(this.t).forEach(k=>{if(this.t[k]){clearTimeout(this.t[k]);this.t[k]=null;this.escribir(k)}})},

    const v=S[k];

      const txt=JSON.stringify(v==null?null:v);

/* ============ pendientes, agenda y calendarios ============ */
function urlOk(u){return /^https:\/\/[^\s"'<>]+$/i.test(String(u||''))}
function cuando(f){if(!f)return 'Sin fecha';const d=diasHasta(f);return d===0?'Hoy':d===1?'Mañana':d>1?'En '+d+' días':d===-1?'Ayer':'Hace '+(-d)+' días'}
function proxCumple(c){const h=new Date(hoyISO()+'T12:00:00'),y=h.getFullYear();for(let n=0;n<2;n++){let d=new Date(y+n,c.mes-1,c.dia,12);if(d.getMonth()!==c.mes-1)d=new Date(y+n,c.mes,0,12);if(d>=h)return iso(d)}return ''}
function pendientes(){
  const L=[];
  S.plazos.forEach(p=>{if(p.estado!=='cumplido')L.push({k:'plazo',id:p.id,titulo:p.titulo,sub:[p.origen,p.via].filter(Boolean).join(' · '),fecha:p.fecha,ej:p.ejemplo,nota:p.nota,correo:p.correo,adj:p.adjuntos})});
  S.oficios.forEach(o=>{if(o.estado==='enviado')L.push({k:'oficio',id:o.id,titulo:'Respuesta pendiente: Oficio N°'+o.numero,sub:o.mat||'',fecha:o.plazoRespuesta||'',ej:o.ejemplo})});
  S.actas.forEach(a=>(a.acuerdos||[]).forEach((c,i)=>{if(c.texto&&!c.hecho)L.push({k:'acuerdo',id:a.id,i:i,titulo:c.texto,sub:'Acuerdo de '+a.tipo+(c.responsable?' · '+c.responsable:''),fecha:c.plazo||'',ej:a.ejemplo})}));
  S.docs.forEach(d=>{if(d.estado!=='listo')L.push({k:'doc',id:d.id,titulo:d.accion+': '+d.nombre,sub:'Documento'+(d.anual?' · se repite cada año':''),fecha:d.fecha,url:d.url})});
  return L.sort((x,y)=>(x.fecha||'9999').localeCompare(y.fecha||'9999'));
}
function proximos(){
  const h=hoyISO(),L=pendientes();
  S.eventos.forEach(e=>{if(e.fecha&&e.fecha>=h)L.push({k:'evento',id:e.id,titulo:e.titulo,sub:[e.lugar,(dest(e.cal)||{}).nombre].filter(Boolean).join(' · '),fecha:e.fecha,hora:e.hora,ej:e.ejemplo})});
  return L.sort((x,y)=>((x.fecha||'9999')+(x.hora||'')).localeCompare((y.fecha||'9999')+(y.hora||'')));
}
/* destinos: cada calendario es «directo» (conector de Google Calendar) o «por enlace» (abre Google Calendar en esa cuenta) */
function dests(){return AND?[]:(S.perfil.calendarios||[])}
function dest(id){const L=dests();return L.find(d=>d.id===id)||L.find(d=>d.id===S.perfil.calDefecto)||L[0]||null}
function selCal(id,val){const L=dests();if(!L.length)return '';const act=(dest(val)||{}).id;return '<label class="f"><span>Calendario</span><select id="'+id+'">'+L.map(d=>'<option value="'+d.id+'"'+(d.id===act?' selected':'')+'>'+esc(d.nombre)+(d.tipo==='conector'?' (directo)':' (por enlace)')+'</option>').join('')+'</select></label>'}
function finEvento(sp){const d=new Date(sp.fecha+'T'+sp.hora+':00');d.setMinutes(d.getMinutes()+(Number(sp.dur)||60));return iso(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00'}
function linkCal(sp){
  if(!sp||!sp.fecha)return '';
  const d=dest(sp.cal),z=s=>s.replace(/[-:]/g,'');
  let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(sp.titulo||'');
  if(sp.hora){u+='&dates='+z(sp.fecha+'T'+sp.hora+':00')+'/'+z(finEvento(sp));try{u+='&ctz='+encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone)}catch(e){}}
  else u+='&dates='+z(sp.fecha)+'/'+z(masDias(sp.fecha,1));
  u+='&details='+encodeURIComponent(sp.detalle||'Registrado en Gestión Directiva');
  if(sp.lugar)u+='&location='+encodeURIComponent(sp.lugar);
  if(sp.anual)u+='&recur='+encodeURIComponent('RRULE:FREQ=YEARLY');
  if(d&&d.tipo==='enlace'&&d.correo)u+='&authuser='+encodeURIComponent(d.correo);
  return u;
}
function entradaEvento(sp,d){
  const o={summary:sp.titulo,calendarId:d.calId,description:sp.detalle||''};
  if(sp.hora){o.startTime=sp.fecha+'T'+sp.hora+':00';o.endTime=finEvento(sp)}else{o.allDay=true;o.startTime=sp.fecha+'T00:00:00';o.endTime=masDias(sp.fecha,1)+'T00:00:00'}
  if(sp.lugar)o.location=sp.lugar;
  if(sp.anual)o.recurrenceData=['RRULE:FREQ=YEARLY'];
  return o;
}
function claveDe(k){return {plazo:'plazos',oficio:'oficios',acuerdo:'actas',evento:'eventos',doc:'docs',cumple:'cumples'}[k]}
function specDe(k,id,i){
  if(k==='plazo'){const p=S.plazos.find(x=>x.id===id);return p?{titulo:'Plazo: '+p.titulo,fecha:p.fecha,detalle:[p.origen,p.via].filter(Boolean).join(' · '),obj:p}:null}
  if(k==='oficio'){const o=S.oficios.find(x=>x.id===id);return o?{titulo:'Respuesta pendiente: Oficio N°'+o.numero,fecha:o.plazoRespuesta,detalle:o.mat||'',obj:o}:null}
  if(k==='acuerdo'){const a=S.actas.find(x=>x.id===id),c=a&&(a.acuerdos||[])[Number(i)];return c?{titulo:'Acuerdo: '+c.texto,fecha:c.plazo,detalle:'Acuerdo de '+a.tipo+(c.responsable?' · Responsable: '+c.responsable:''),obj:c}:null}
  if(k==='evento'){const e=S.eventos.find(x=>x.id===id);return e?{titulo:e.titulo,fecha:e.fecha,hora:e.hora,dur:e.dur,lugar:e.lugar,detalle:e.detalle,cal:e.cal,obj:e}:null}
  if(k==='doc'){const d=S.docs.find(x=>x.id===id);return d?{titulo:d.accion+': '+d.nombre,fecha:d.fecha,detalle:urlOk(d.url)?'Documento: '+d.url:'',anual:d.anual,obj:d}:null}
  if(k==='cumple'){const c=S.cumples.find(x=>x.id===id);return c?{titulo:'Cumpleaños de '+c.nombre,fecha:proxCumple(c),anual:true,obj:c}:null}
  return null;
}
function btnCal(k,id,i){

/* ============ texto con formato simple ============ */
function bloques(txt){
  const out=[];let par=[];const fl=()=>{if(par.length){out.push({t:'p',x:par.join(' ')});par=[]}};
  String(txt||'').split(/\r?\n/).forEach(l=>{const s=l.trim();if(!s){fl();return}if(s.indexOf('## ')===0){fl();out.push({t:'h',x:s.slice(3)});return}if(/^[-•]\s+/.test(s)){fl();out.push({t:'li',x:s.replace(/^[-•]\s+/,'')});return}par.push(s)});fl();return out;
}
function neg(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
function htmlBloques(txt){let h='',enL=false;bloques(txt).forEach(b=>{if(b.t==='li'){if(!enL){h+='<ul>';enL=true}h+='<li>'+neg(b.x)+'</li>';return}if(enL){h+='</ul>';enL=false}h+=b.t==='h'?'<h4>'+neg(b.x)+'</h4>':'<p>'+neg(b.x)+'</p>'});if(enL)h+='</ul>';return h}

/* ============ revisión previa (nada se firma sin revisar) ============ */
function revisarOficio(o){
  const R=[];
  if(!String(o.mat).trim())R.push(['crit','Falta la materia (MAT.).']);
  if(!String(o.aNombre).trim())R.push(['crit','Falta el destinatario.']);
  if(!String(o.cuerpo).trim())R.push(['crit','El cuerpo del oficio está vacío.']);
  const marc=(String(o.cuerpo).match(/\[[^\]]+\]/g)||[]);if(marc.length)R.push(['crit','Quedan '+marc.length+' marcadores sin completar, por ejemplo '+marc[0]+'.']);
  if(S.oficios.some(x=>x.id!==o.id&&x.anio===o.anio&&Number(x.numero)===Number(o.numero)&&!x.ejemplo))R.push(['crit','El N°'+o.numero+' ya está usado en otro oficio de '+o.anio+'.']);
  const m=String(o.ant).match(/N[°ºo]?\s*(\d+)/i);if(m&&!S.oficios.some(x=>Number(x.numero)===Number(m[1])&&x.id!==o.id))R.push(['warn','El ANT. cita el oficio N°'+m[1]+', que no está en este libro. Verifica el número.']);
  if(o.fecha&&diasHasta(o.fecha)!==0&&o.estado==='borrador')R.push(['warn','La fecha del oficio no es la de hoy ('+fechaCorta(o.fecha)+').']);
  if(!String(o.distribucion).trim())R.push(['warn','Falta la distribución.']);
  if(o.iaSinRevisar)R.push(['warn','El cuerpo fue propuesto por la IA y aún no confirmas que lo revisaste.']);
  if(o.tipo==='amp'){const f=o.ficha||{};if(!f.nombre||!f.rut)R.push(['warn','La ficha de derivación no tiene nombre o RUN del estudiante.']);if(!String(f.relato||'').trim())R.push(['warn','La ficha de derivación no tiene relato.'])}
  if(!S.firma)R.push(['info','No hay firma cargada: el documento sale con línea para firma manuscrita.']);
  return R;
}
function revisarActa(a){
  const R=[];
  if(!a.fecha)R.push(['crit','Falta la fecha.']);
  if(a.inicio&&a.termino&&a.termino<=a.inicio)R.push(['crit','La hora de término ('+a.termino+') no es posterior a la de inicio ('+a.inicio+').']);
  if(!a.inicio||!a.termino)R.push(['warn','Falta la hora de inicio o de término.']);
  if(!String(a.redactor).trim())R.push(['warn','Falta indicar quién redacta el acta.']);
  if(!(a.asistentes||[]).some(p=>p.presente))R.push(['warn','No hay ningún participante marcado como presente.']);
  (a.acuerdos||[]).forEach((c,i)=>{if(c.texto&&(!c.responsable||!c.plazo))R.push(['warn','El acuerdo '+(i+1)+' no tiene '+(!c.responsable?'responsable':'plazo')+'.'])});
  if(a.notas&&!a.consentimiento)R.push(['info','Si las notas se tomaron con registro de voz, deja constancia del consentimiento.']);
  if(a.iaSinRevisar)R.push(['warn','El desarrollo y los acuerdos fueron propuestos por la IA y aún no confirmas que los revisaste.']);
  return R;
}

/* de un documento largo se envían a la IA solo el inicio y los pasajes con fechas o periodicidades */
function pasajes(t){
  const re=/(\b\d{1,2}\s+de\s+(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\b|\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b|vigencia|vigente hasta|revisi[oó]n|actualizaci[oó]n|actualizar[áa]|anualmente|cada a[ñn]o|una vez al a[ñn]o|semestral|cuenta p[úu]blica|rendici[oó]n|vencimiento|vence el)/gi;
  const R=[];let m;
  while((m=re.exec(t))&&R.length<600){const a=Math.max(0,m.index-160),b=Math.min(t.length,m.index+240);if(R.length&&a<=R[R.length-1][1])R[R.length-1][1]=b;else R.push([a,b])}
  let out=t.slice(0,1200);
  for(const r of R){if(r[1]<=1200)continue;const s=t.slice(Math.max(r[0],1200),r[1]).replace(/\s+/g,' ');if(out.length+s.length>14000)break;out+='\n[…] '+s}
  return out;
}

document.addEventListener('input',e=>{
  const el=e.target;if(el.dataset&&el.dataset.mem){S[el.dataset.mem]=el.value;return}
  if(el.dataset&&el.dataset.aInput==='wa'){actualizarWA();return}
  if(el.dataset&&el.dataset.aInput==='bus-p'){S.busP=el.value;const l=$('#lp');if(l)l.innerHTML=listaP();return}

document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.bind&&(el.type==='checkbox'||el.tagName==='SELECT')){enlazar(el);if(el.dataset.rerender)render();return}
  if(el.dataset.aChange==='dest'){const o=actual(),d=(S.perfil.destinatarios||[])[Number(el.value)];if(o&&d&&el.value!==''){o.aNombre=d.nombre;o.aCargo=d.cargo;Store.guardar('oficios');render()}return}
  if(el.dataset.aChange==='wa'){const c=(S.perfil.contactos||[])[Number(el.value)];if(c&&el.value!==''){const n=$('#wa-n');if(n)n.value=c.telefono}actualizarWA();return}
  if(el.dataset.aChange==='ver-frase'){const f=$('#sy-f');if(f)f.type=el.checked?'text':'password';return}
  if(el.dataset.aChange==='sem-r'){S.semR=el.value;render();return}
  if(el.dataset.aChange==='caldef'){S.perfil.calDefecto=el.value;Store.guardar('perfil');render();return}
  if(el.dataset.aChange==='ia-ok'){const x=actual();if(x&&el.checked){x.iaSinRevisar=false;Store.guardar(S.ed.t==='oficio'?'oficios':'actas');render()}return}
  if(el.dataset.img&&el.files&&el.files[0]){cargarImagen(el.files[0],el.dataset.img);return}
  if(el.dataset.import&&el.files&&el.files[0]){importar(el.files[0]);return}
});
function enlazar(el){
  const ctx=el.dataset.ctx,obj=ctx==='perfil'?S.perfil:actual();if(!obj)return;
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.num)v=Number(v)||1;
  if(el.dataset.parse==='lineas')v=String(v).split('\n').map(s=>s.trim()).filter(Boolean);
  if(el.dataset.parse==='comas')v=String(v).split(',').map(s=>s.trim()).filter(Boolean);
  if(el.dataset.parse==='contactos')v=String(v).split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{const q=l.split('|');return {nombre:(q[0]||'').trim(),telefono:(q.slice(1).join('|')||'').trim()}});
  if(el.dataset.parse==='dest')v=String(v).split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const p=l.split('|');return {nombre:(p[0]||'').trim(),cargo:(p.slice(1).join('|')||'').trim()}});
  setPath(obj,el.dataset.bind,v);
  if(ctx==='perfil'){Store.guardar('perfil');if(el.dataset.tema){aplicarTema();const c=$('#contraste');if(c)c.textContent=contrasteTxt()}}
  else{Store.guardar(S.ed.t==='oficio'?'oficios':'actas');refrescarPrevia()}
}
function cargarImagen(file,k){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const max=k==='logo'?260:520,esc2=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*esc2)),h=Math.max(1,Math.round(im.height*esc2)),cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d'),png=/png/i.test(file.type);if(!png){cx.fillStyle='#fff';cx.fillRect(0,0,w,h)}cx.drawImage(im,0,0,w,h);
    S[k]={src:png?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.86),w:w,h:h};Store.guardar(k);aplicarTema();render();toast(k==='logo'?'Insignia cargada.':'Firma cargada.')};
    im.onerror=()=>toast('No se pudo leer la imagen.');im.src=fr.result};
  fr.readAsDataURL(file);
}
function imagenADatos(ruta){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{try{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,im.width,im.height);cx.drawImage(im,0,0);ok({src:cv.toDataURL('image/jpeg',.9),w:im.width,h:im.height})}catch(e){no(e)}};im.onerror=no;im.src=ruta})}
function importar(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||d.app!=='gestion-directiva'||!d.perfil)throw 0;
    S.perfil=Object.assign(JSON.parse(JSON.stringify(PERFIL_BASE)),d.perfil);LISTAS.forEach(k=>{S[k]=Array.isArray(d[k])?d[k]:[]});if(!Array.isArray(S.perfil.calendarios))S.perfil.calendarios=[];S.logo=d.logo||null;S.firma=d.firma||null;S.puente=d.puente||null;S.ed=null;
    CLAVES.forEach(k=>Store.guardar(k));Puente.preparar();aplicarTema();render();toast('Respaldo importado.')}catch(e){toast('El archivo no es un respaldo válido de esta aplicación.')}};
  fr.readAsText(file);
}

async function capacidades(){
  if(AND){
    S.dl={save:async o=>{const b=await aBase64(o.data);if(!AND.archivo(o.filename,mimeDe(o.filename),b,false))throw {code:'unavailable'};return {status:'saved'}}};
    document.body.classList.add('has-dl','es-android','has-mic');return;
  }
  if(!(window.claude&&typeof window.claude.use==='function')){
    /* navegador común (página instalada en el PC): los archivos se descargan directamente */
    S.dl={save:async o=>{const b=o.data instanceof Blob?o.data:new Blob([o.data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return {status:'saved'}}};
    document.body.classList.add('has-dl');return;
  }
  const u=n=>window.claude.use(n).catch(()=>null);
  u('sample').then(x=>{if(x){S.ia=x;document.body.classList.add('has-ia')}});
  u('dictation').then(x=>{if(x){S.dict=x;iniciarDictado(x);document.body.classList.add('has-mic')}});
  u('downloads').then(x=>{if(x){S.dl=x;document.body.classList.add('has-dl')}});
  u('mcp').then(async x=>{if(!x)return;try{const r=await x.listTools(),n=((r&&r.servers)||[]).map(s=>s.server);if(n.indexOf('Google Calendar')>=0){S.mcp=x;document.body.classList.add('has-cal')}if(n.indexOf('Google Drive')>=0){S.drv=x;document.body.classList.add('has-drive')}}catch(e){}});
}
/* Detecta si la aplicación está abierta en varias ventanas o pestañas del mismo navegador:
   cada una mantiene su propia conexión con la nube, y muchas a la vez pueden trabar la sincronización. */
const VERSION_APP='18-11-2026 (c)';
const Instancias={id:Math.random().toString(36).slice(2),otras:{},
  iniciar(){
    try{
      this.bc=new BroadcastChannel('gestion-directiva');
      this.bc.onmessage=e=>{const m=e.data||{};if(!m.id||m.id===this.id)return;
        if(m.t==='chao'){delete this.otras[m.id]}else{const nueva=!this.otras[m.id];this.otras[m.id]=Date.now();if(m.t==='hola')this.bc.postMessage({t:'aqui',id:this.id});if(nueva&&!AND)toast('La aplicación también está abierta en otra ventana o pestaña. Conviene dejar una sola.')}};
      this.bc.postMessage({t:'hola',id:this.id});
      setInterval(()=>{try{this.bc.postMessage({t:'aqui',id:this.id})}catch(e){}},30000);
      window.addEventListener('pagehide',()=>{try{this.bc.postMessage({t:'chao',id:this.id})}catch(e){}});
    }catch(e){}
  },
  cuantas(){const t=Date.now()-75000;return Object.keys(this.otras).filter(k=>this.otras[k]>t).length}
};
async function arrancar(){
  Instancias.iniciar();
  render();capacidades();
  await Store.init();
  const v=await Promise.all(CLAVES.map(k=>Store.leer(k)));
  const primera=!(v[0]&&typeof v[0]==='object');let sembrado=false;
  if(!primera){S.perfil=Object.assign(JSON.parse(JSON.stringify(PERFIL_BASE)),v[0]);CLAVES.forEach((k,i)=>{if(i)S[k]=LISTAS.indexOf(k)>=0?(Array.isArray(v[i])?v[i]:[]):(v[i]||null)})}
  /* si quien abre es dueño y dejó un perfil inicial, se aplica mientras el perfil siga siendo el genérico */
  if(Store.modo==='cuenta'&&(primera||S.perfil.nombre===PERFIL_BASE.nombre)){
    try{const s=await conTimeout(Store.db.doc('seed/perfil').get(),8000);if(s.exists){const d=s.data();if(d.perfil){S.perfil=Object.assign(JSON.parse(JSON.stringify(PERFIL_BASE)),d.perfil);sembrado=true}
      if(d.logoArchivo&&/^[a-z0-9-]+\.(jpg|png)$/.test(d.logoArchivo)&&!S.logo){try{S.logo=await conTimeout(imagenADatos(d.logoArchivo),6000)}catch(e){}}}}catch(e){}
  }
  if(!Array.isArray(S.perfil.calendarios))S.perfil.calendarios=[];
  const soloEj=[S.plazos,S.oficios,S.actas].every(l=>l.every(x=>x.ejemplo));
  if(primera||(sembrado&&soloEj))ejemplos();
  if(primera||sembrado)CLAVES.forEach(k=>Store.guardar(k));
  S.libros={personal:lsG('libro_personal'),reporte:lsG('libro_reporte')};
  Sync.iniciar();Puente.preparar();
  {const lim=Date.now()-14*864e5,n0=S.registros.length;S.registros=S.registros.filter(r=>!((r.estado==='anotado'||r.estado==='borrador')&&r.creado<lim));if(S.registros.length!==n0)Store.guardar('registros')}
  S.cargando=false;aplicarTema();pintarEstado();render();
  if(S.compartidoPend){const c=S.compartidoPend;S.compartidoPend=null;recibirCompartido(c.t,false,c.a)}else window.__compartido();
  if(document.querySelector('link[rel="manifest"]')&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
arrancar();
</script>
